plugins { id 'com.android.application' }
android {
    namespace 'app.commoncopy.mobile'
    compileSdk 36
    defaultConfig { applicationId 'app.commoncopy.mobile'; minSdk 30; targetSdk 36; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test { resources.srcDir('../../fixtures') } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20250517' }
