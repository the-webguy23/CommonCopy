name: Mobile development checks
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon -p mobile/android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CommonCopy-Android-development
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: mobile/android/app/build/reports/tests/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path mobile/ios
      - run: brew install xcodegen
      - run: cd mobile/ios && xcodegen generate
      - run: xcodebuild -project mobile/ios/CommonCopyMobile.xcodeproj -scheme CommonCopy -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: CommonCopy-iOS-simulator-development
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/CommonCopy.app
