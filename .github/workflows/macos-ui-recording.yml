name: macOS UI recording
on:
  push:
    branches: ["media/commoncopy-macos-hero"]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build actual macOS application
        run: bash scripts/build-macos.sh arm64
      - name: Compile native recording driver
        run: |
          mkdir -p artifacts/mac-ui
          swiftc -parse-as-library tools/mac-recording/Recorder.swift -o artifacts/Recorder
      - name: Record the actual macOS workflows
        run: artifacts/Recorder artifacts/macos-arm64/CommonCopy.app artifacts/mac-ui tools/mac-recording/sample-email.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CommonCopy-mac-UI
          path: artifacts/mac-ui/
