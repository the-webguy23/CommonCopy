name: macOS UI recording
on:
  push:
    branches: ["media/commoncopy-macos-hero"]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check actual destination apps
        run: |
          mkdir -p artifacts/mac-ui
          swift tools/mac-recording/Probe.swift artifacts/mac-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CommonCopy-mac-UI
          path: artifacts/mac-ui/
