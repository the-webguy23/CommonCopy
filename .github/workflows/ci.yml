name: Windows CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CommonCopy.sln

      - name: Build
        run: dotnet build CommonCopy.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CommonCopy.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage"

      - name: Publish Windows x64 prototype
        run: >-
          dotnet publish src/CommonCopy.Windows/CommonCopy.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output artifacts/publish/win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

      - name: Upload portable prototype
        uses: actions/upload-artifact@v4
        with:
          name: CommonCopy-Portable-win-x64
          path: artifacts/publish/win-x64/
